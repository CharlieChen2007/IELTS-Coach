<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4388c4" />
  <meta name="app-version" content="2026-11-11-subject-repair" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>IELTS Coach · 学术类雅思 AI 陪练</title>
  <script src="/cloud-config.js"></script>
  <script>
    (() => {
      const html=document.documentElement, reduce=matchMedia('(prefers-reduced-motion: reduce)');
      const forced=new URLSearchParams(location.search).get('motion');
      const update=()=>{html.dataset.motion=reduce.matches || forced==='off'?'off':'high';};
      update();reduce.addEventListener('change',update);
      html.dataset.booting='';window.__VER='2026-11-11-subject-repair';
    })();
  </script>
  <script src="/motion.js" defer></script>
  <link rel="stylesheet" href="/navigation-motion.css" />
  <script src="/navigation-motion.js" defer></script>
  <style>
    html,body{margin:0;background:#f5f8fb;color:#233b50}
    #boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,#f8fcff,#e8f4fb);font-family:'Segoe UI','Microsoft YaHei',sans-serif;transition:opacity 260ms ease;pointer-events:none}
    #boot::before,#boot::after{content:'';position:absolute;width:60vw;height:60vw;border-radius:50%;background:radial-gradient(circle,#bfdef23d,transparent 65%);transform:translate(-36%,-26%)}
    #boot::after{transform:translate(40%,36%);background:radial-gradient(circle,#a3d5ed2b,transparent 65%)}
    .boot-stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:24px;text-align:center}
    .boot-emblem{width:70px;height:70px;display:grid;place-items:center;margin:0 0 24px;background:linear-gradient(145deg,#fff,#d8ecfa);color:#2f6b8f;border-radius:22px;box-shadow:0 10px 30px #2f6b8f24;animation:boot-emblem 520ms cubic-bezier(.22,.8,.24,1) both}
    .boot-emblem svg{width:39px;height:39px}
    .boot-title{display:flex;justify-content:center;flex-wrap:wrap;font-size:clamp(34px,5vw,52px);letter-spacing:-1.3px;margin:0 0 16px;font-weight:800}
    .boot-title span{display:inline-block;white-space:pre;animation:boot-letter 540ms cubic-bezier(.34,.12,.28,1) both;animation-delay:calc(var(--i)*34ms)}
    .boot-sub{font-size:15px;color:#4a6075;margin:0 0 24px;animation:boot-letter 540ms ease 350ms both}
    .boot-line{width:166px;height:3px;background:#397fb51a;border-radius:10px;overflow:hidden}
    .boot-line i{display:block;height:100%;background:linear-gradient(90deg,#76b7dd,#397fb5);transform-origin:left;animation:boot-line 680ms cubic-bezier(.22,.8,.24,1) 400ms both}
    #boot.boot-out{opacity:0}
    html[data-booting] #root{opacity:0;pointer-events:none}
    html[data-motion="off"] #boot{display:none}
    @keyframes boot-emblem{from{opacity:.18;transform:translateY(12px) scale(.86)}to{opacity:1;transform:none}}
    @keyframes boot-letter{from{opacity:0;transform:translateY(17px)}to{opacity:1;transform:none}}
    @keyframes boot-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
    @media(prefers-reduced-motion:reduce){#boot{display:none}}
  </style>
</head>
<body>
  <div id="boot" aria-hidden="true"><div class="boot-stage">
    <div class="boot-emblem"><svg viewBox="0 0 40 40" fill="none"><path d="m8 19 24-11-8 26-5.5-11L8 19Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M18.5 23 32 8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
    <h1 class="boot-title" aria-label="IELTS Coach"><span style="--i:0">I</span><span style="--i:1">E</span><span style="--i:2">L</span><span style="--i:3">T</span><span style="--i:4">S</span><span style="--i:5"> </span><span style="--i:6">C</span><span style="--i:7">o</span><span style="--i:8">a</span><span style="--i:9">c</span><span style="--i:10">h</span></h1>
    <p class="boot-sub">练完一次，就知道下一步该练什么</p><div class="boot-line"><i></i></div>
  </div></div>
  <div id="root"></div>
  <noscript>请启用 JavaScript 后使用练习功能。</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
