  <title>口语练习 · IELTS Coach</title>
  <script>
    /* 嵌入学习空间时，首帧之前就打上 host-embedded：coach-theme.css 靠这个 class
       隐藏模块自带的二级导航。以前它要等 app.js → connectHost() 运行时才加上，
       于是 iframe 淡入的最初几帧会把「模考工作台 / 自由对话 / … / 本机工作区」
       闪出来。head 内联执行后，第一次样式计算时 topbar 就已经是隐藏的。 */
    (function () {
      try {
        var p = new URLSearchParams(location.search);
        if (window.parent !== window && p.get('embedded') === '1') {
          document.documentElement.classList.add('host-embedded');
        }
      } catch (e) {}
    })();
  </script>
  <style>html.host-embedded .topbar{display:none!important}</style>
  <meta name="description" content="雅思口语三部分模考、考后报告与自由对话陪练。">
